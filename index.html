<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>UniversEvasionVideo</title>
  <style>
    body {
      background-color: #eef6ff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
      margin: 0;
    }

    h1 {
      color: #0055aa;
      font-size: 40px;
    }

    p {
      font-size: 20px;
      color: #333;
    }

    a {
      display: inline-block;
      background-color: #0055aa;
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 18px;
      margin-top: 20px;
    }

    a:hover {
      background-color: #0077ff;
      transform: scale(1.05);
      transition: 0.3s;
    }

    /* Effet parallax */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://i.imgur.com/your-vhs-image.jpg');
      background-size: cover;
      background-position: center;
      z-index: -1;
      transition: transform 0.2s ease-out;
    }
  </style>
</head>
<body>

  <div class="background"></div>

  <h1>Bienvenue sur UniversEvasionVideo</h1>
  <p>Un univers dédié aux vidéos, aux effets rétro et à la créativité.</p>

  <a href="https://t.me/UniversEvasionVideo">Rejoindre sur Telegram</a>

  <script>
    // Effet parallax
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      document.querySelector('.background').style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>

</body>
</html>
